<!-- BUILD: recordings v2 2026-10-07 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Call Recordings — SpamViking</title>
<style>
  :root{
    --bone:#f4f1ea; --bone2:#eae4d8; --ink:#1b1714; --muted:#6f685b;
    --blood:#a4161a; --blood2:#7d0f13; --gold:#c9821a; --gold2:#e3a93f;
    --line:#d9d2c4;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:860px;margin:0 auto;padding:22px 18px 60px}

  header.hd{display:flex;align-items:center;gap:10px;padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
  .hd .mark{font-size:18px}
  .hd .brand{font-family:var(--mono);font-weight:700;letter-spacing:.04em;font-size:14px}
  .hd .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;margin-left:2px}
  .hd .reload{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#7a7060;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  .hd .reload:hover{border-color:var(--gold);color:var(--blood)}

  h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 4px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 20px}

  /* states */
  .state{padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:#fbf8f1}
  .state .big{font-family:var(--serif);font-size:19px;margin:0 0 8px}
  .state .msg{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto;line-height:1.6}
  .state.err .big{color:var(--blood)}

  /* list */
  .rec{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:12px;overflow:hidden}
  .rec .top{display:flex;align-items:flex-start;gap:14px;padding:14px 16px}
  .rec .when{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:94px}
  .rec .meat{flex:1;min-width:0}
  .rec .org{font-weight:600;font-size:15px;line-height:1.25}
  .rec .num{font-family:var(--mono);font-size:12px;color:#5a5346;margin-top:2px}
  .rec .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    border-radius:5px;padding:2px 7px;border:1px solid var(--line);color:#6f685b;background:#faf7f0}
  .tag.chan{border-color:#b9c7d8;color:#35506e;background:#eef3f9}
  .tag.flag{border-color:var(--gold);color:#8a5a12;background:#fbf0d8}
  .tag.out{border-color:#bcd6b4;color:#39702c;background:#eef6ea}
  .rec .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:2px}
  .rec .dur{font-family:var(--mono);font-size:11px;color:var(--muted)}

  .playbtn{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.02em;
    border:1.5px solid var(--blood);background:var(--blood);color:#fff;border-radius:8px;padding:7px 15px;cursor:pointer;white-space:nowrap}
  .playbtn:hover{background:var(--blood2)}
  .playbtn.off{border-color:var(--line);background:#f1ede4;color:#a99a7c;cursor:default}
  .unavail{font-family:var(--mono);font-size:10.5px;color:#a99a7c;text-align:right;max-width:150px}

  /* inline player row (revealed on play) */
  .player{border-top:1px solid var(--line);padding:12px 16px;background:#fbf8f1;display:none}
  .player.on{display:block}
  .player audio{width:100%}

  footer.ft{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10px;color:#a99a7c;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer.ft a{color:#8a7b5c}

  @media (max-width:560px){
    .rec .top{flex-wrap:wrap}
    .rec .when{min-width:0;width:100%}
    .rec .right{flex-direction:row;align-items:center;width:100%;justify-content:space-between;margin-top:4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <span class="mark">⚔</span>
    <span class="brand">SpamViking</span>
    <span class="sub">Hall of Shame</span>
    <button class="reload" id="reloadBtn" title="refresh the list">↻ Refresh</button>
  </header>

  <h1>Your call recordings</h1>
  <p class="lead" id="lead">The calls your host ran against the scammers — newest first.</p>

  <div id="list"></div>

  <footer class="ft">
    <span>⚔ SpamViking · Hall of Shame</span>
    <span>recordings v2 · 2026-10-07</span>
  </footer>
</div>

<script>
(function(){
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var listEl = $('#list');

  // --- token straight from the recap-email link; we pass it through, we don't mint it ---
  var qp = new URLSearchParams(location.search);
  var TOKEN = qp.get('token') || '';
  var API = (qp.get('api') || 'https://posture-engine.vercel.app/api/recordings');

  var EXPIRES_MS = 3600 * 1000;   // play_url_expires_in_seconds default; overwritten by the response
  // Clip screen (video-editor timeline w/ bit markers) is UNBUILT. Keep the per-row clip badge
  // visible but inert (informational only). When the clip screen ships, make the badge a link.
  var CLIPS_SHOWN = true;
  var lastLoadedAt = 0;

  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }

  function showState(kind, big, msg){
    listEl.innerHTML = '<div class="state'+(kind==='err'?' err':'')+'">'
      + '<p class="big">'+esc(big)+'</p><p class="msg">'+msg+'</p></div>';
  }

  function fmtWhen(iso){
    if(!iso) return '';
    var d = new Date(iso); if(isNaN(d)) return esc(iso);
    return d.toLocaleDateString([], {month:'short', day:'numeric'})
         + ' · ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }
  function fmtDur(s){
    s = Math.max(0, Math.round(Number(s)||0));
    var m = Math.floor(s/60), ss = s%60;
    return m + ':' + (ss<10?'0':'') + ss;
  }
  var CHAN = { phone:'Phone', inbound:'Inbound', web:'Web' };
  // friendly outcome labels — map known values; anything unexpected becomes a generic label
  // rather than a raw string. Keyed loosely so new snake_case values still read cleanly.
  var OUTCOME = {
    answered_human:'Picked up',
    answered_ivr:'Hit their phone tree',
    voicemail_left:'Left a voicemail',
    hung_up:'Hung up',
    rage_quit:'Rage quit',
    slow_fade:'Faded out',
    no_show:'No show',
    death_blow:'Finished off'
  };
  function outcomeLabel(o){
    if(!o) return '';
    if(OUTCOME[o]) return OUTCOME[o];
    // unexpected value -> generic, readable fallback (never a raw snake_case string)
    return 'Call complete';
  }

  function render(data){
    var recs = (data && data.recordings) || [];
    if(!recs.length){
      showState('', 'No recordings yet',
        'Once your host runs a call, it’ll show up here. Only calls from this week onward are tied to your account, so the list may be short at first.');
      return;
    }
    var html = recs.map(function(r, i){
      var purged = !!r.purged;
      var canPlay = !purged && r.playable && r.play_url;

      var tags = [];
      if(r.channel && CHAN[r.channel]) tags.push('<span class="tag chan">'+esc(CHAN[r.channel])+'</span>');
      else if(r.channel) tags.push('<span class="tag chan">'+esc(r.channel)+'</span>');
      var oLabel = outcomeLabel(r.outcome);
      if(oLabel) tags.push('<span class="tag out">'+esc(oLabel)+'</span>');
      // clip badge: purely informational for now (the clip/timeline screen isn't built).
      // Inert — looks like a status tag, not a button. Flip CLIPS_LINKED to true (and give it
      // an href/handler) once the clip screen exists.
      if(r.clip_flag && CLIPS_SHOWN) tags.push('<span class="tag flag" title="marked for a clip">✂ clip</span>');

      var right;
      if(purged){
        right = '<div class="unavail">no longer available</div>';
      } else if(canPlay){
        right = '<button class="playbtn" data-i="'+i+'">▶ Play</button>';
      } else {
        var why = (r.play_error==='no_recording') ? 'recording missing'
                : (r.play_error==='sign_failed') ? 'temporarily unavailable'
                : 'not available';
        right = '<div class="unavail">'+esc(why)+'</div>';
      }

      var org = r.claimed_org || r.host_name || 'Unknown caller';
      var num = [r.number, r.target_email].filter(Boolean).map(esc).join('  ·  ');

      return ''
        + '<div class="rec">'
        +   '<div class="top">'
        +     '<div class="when">'+esc(fmtWhen(r.started_at))+'</div>'
        +     '<div class="meat">'
        +       '<div class="org">'+esc(org)+'</div>'
        +       (num ? '<div class="num">'+num+'</div>' : '')
        +       (tags.length ? '<div class="tags">'+tags.join('')+'</div>' : '')
        +     '</div>'
        +     '<div class="right">'
        +       '<div class="dur">'+esc(fmtDur(r.duration_seconds))+'</div>'
        +       right
        +     '</div>'
        +   '</div>'
        +   '<div class="player" id="pl-'+i+'"></div>'
        + '</div>';
    }).join('');
    listEl.innerHTML = html;

    // wire play buttons — no autoplay (iOS blocks it anyway); reveal an inline <audio> with controls
    Array.prototype.forEach.call(document.querySelectorAll('.playbtn[data-i]'), function(btn){
      btn.addEventListener('click', function(){
        var i = btn.getAttribute('data-i');
        var r = recs[i];
        // if the signed URL has aged past its TTL, re-fetch the list rather than fail silently
        if(Date.now() - lastLoadedAt > EXPIRES_MS - 60000){ load(); return; }
        var slot = $('#pl-'+i);
        slot.innerHTML = '<audio controls preload="none" src="'+esc(r.play_url)+'"></audio>';
        slot.classList.add('on');
        var a = slot.querySelector('audio'); if(a){ try{ a.play(); }catch(e){} }
        btn.textContent = '▶ Playing';
      });
    });
  }

  function load(){
    if(!TOKEN){
      showState('err', 'This link is missing its code',
        'Open the recordings link straight from your SpamViking email — the link carries the code that proves it’s you.');
      return;
    }
    showState('', 'Loading your recordings…', '');
    fetch(API + '?token=' + encodeURIComponent(TOKEN), { cache:'no-store' })
      .then(function(res){
        if(res.status === 401){
          showState('err', 'This link has expired',
            'For your security these links time out. Check your latest SpamViking email for a fresh one.');
          return null;
        }
        if(!res.ok){
          showState('err', 'Couldn’t load your recordings',
            'Something went wrong on our end (error '+res.status+'). Try Refresh in a moment, or open the newest link from your email.');
          return null;
        }
        return res.json();
      })
      .then(function(data){
        if(!data) return;
        if(data.ok === false){
          showState('err', 'Couldn’t load your recordings',
            'Please try the newest link from your SpamViking email.');
          return;
        }
        if(data.play_url_expires_in_seconds) EXPIRES_MS = Number(data.play_url_expires_in_seconds) * 1000;
        lastLoadedAt = Date.now();
        var n = (data.recordings||[]).length;
        $('#lead').textContent = n
          ? ('The calls your host ran against the scammers — newest first.')
          : ('No recordings tied to your account yet.');
        render(data);
      })
      .catch(function(e){
        showState('err', 'Couldn’t reach the server',
          'Check your connection and hit Refresh. If it keeps failing, open the newest link from your email.');
      });
  }

  $('#reloadBtn').addEventListener('click', load);
  // a page left open overnight: the signed URLs die after ~1h, so refresh on refocus if stale
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && lastLoadedAt && (Date.now() - lastLoadedAt > EXPIRES_MS)){ load(); }
  });

  load();
})();
</script>
</body>
</html>
